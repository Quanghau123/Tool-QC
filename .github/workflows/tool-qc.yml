name: Tool-QC
on:
  workflow_dispatch:
    inputs:
      project:
        description: Project name
        required: true
        default: project-template
      tags:
        description: Optional comma-separated tags
        required: false
jobs:
  test:
    runs-on: windows-latest
    env:
      ACTIVE_PROJECT: "${{ inputs.project }}"
      TEST_TAGS: "${{ inputs.tags }}"
      ALLOW_PRODUCTION: "false"
      ALLOW_DESTRUCTIVE_TESTS: "false"
      JUNIT_REPORT_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build ApiAutoTest.sln -c Release
      - name: Test framework
        run: dotnet run --project tests/AutoTest.FrameworkTests/AutoTest.FrameworkTests.csproj -c Release --no-build
      - name: Run selected project
        if: "${{ env.API_BASE_URL != '' }}"
        run: dotnet run --project runner/AutoTest.Runner/AutoTest.Runner.csproj -c Release --no-build -- --project "${{ inputs.project }}" --tags "${{ inputs.tags }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tool-qc-reports
          path: .artifacts/test-runs
